name: Validate Install Scripts

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install shellcheck
              run: sudo apt-get update && sudo apt-get install -y shellcheck
            - name: Lint install.sh
              run: shellcheck -s sh install.sh
            - name: Lint install.ps1
              shell: pwsh
              run: |
                  Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
                  $results = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error
                  if ($results) { $results | Format-Table; exit 1 }

    test-linux:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                container: [ubuntu:24.04, alpine:latest, debian:12-slim]
        steps:
            - uses: actions/checkout@v5
            - name: Install pinner in ${{ matrix.container }}
              uses: vjik/docker-run@v1
              with:
                  image: ${{ matrix.container }}
                  volumes: ${{ github.workspace }}:/workspace
                  env: |
                      CI=true
                  command: |
                      case "${{ matrix.container }}" in
                        alpine*)  apk add --no-cache curl ;;
                        ubuntu*|debian*) apt-get update && apt-get install -y curl ;;
                      esac
                      sh /workspace/install.sh
                      export PATH="$HOME/.local/bin:$PATH"
                      pinner --version

    test-macos-homebrew:
        runs-on: macos-latest
        env:
            PINNER_BREW_TAP: ${{ github.workspace }}/tests/fixtures/homebrew-tap
        steps:
            - uses: actions/checkout@v5
            - name: Install via Homebrew (local tap fixture)
              run: |
                  git init tests/fixtures/homebrew-tap
                  git -C tests/fixtures/homebrew-tap add -A
                  git -C tests/fixtures/homebrew-tap commit -m "fixture" --allow-empty
                  output=$(sh ./install.sh 2>&1)
                  echo "$output"
                  if echo "$output" | grep -qi "installed via Homebrew"; then
                    echo "PASS: Homebrew path reached"
                  else
                    echo "FAIL: Homebrew path not reached"
                    exit 1
                  fi
            - name: Verify pinner works
              run: pinner --version

    test-macos-binary:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install via binary route (--no-pkg)
              run: sh ./install.sh --no-pkg
            - name: Verify pinner works
              run: |
                  export PATH="$HOME/.local/bin:$PATH"
                  pinner --version

    test-windows-binary:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - name: Default install (binary route)
              shell: pwsh
              run: |
                  ./install.ps1
                  pinner --version

    test-windows-winget:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - name: CI mode - winget manifest fixture
              shell: pwsh
              run: |
                  $env:CI = 'true'
                  # Pin version so version resolution is local (no network call).
                  $env:PINNER_VERSION = '0.0.0-test'
                  $env:PINNER_WINGET_MANIFEST = '${{ github.workspace }}\tests\fixtures\winget-manifest'
                  # Capture output — winget will fail (fake URL in fixture) but we verify the route was reached
                  $output = ./install.ps1 *>&1 | Out-String
                  if ($output -match 'CI mode: installing from local manifest') {
                    Write-Host "PASS: WinGet manifest path reached"
                    exit 0
                  } else {
                    Write-Host "FAIL: WinGet manifest path not reached"
                    Write-Host $output
                    exit 1
                  }

    test-windows-scoop:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install scoop (CI prerequisite)
              shell: pwsh
              run: |
                  Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
                  # Scoop installs to ~/scoop; add to PATH for this session
                  $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
            - name: CI mode - scoop manifest fixture
              shell: pwsh
              run: |
                  $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
                  $env:CI = 'true'
                  # Pin version so version resolution is local (no network call).
                  $env:PINNER_VERSION = '0.0.0-test'
                  # Point winget manifest to a non-existent path so it fails fast,
                  # forcing the script to fall through to scoop.
                  $env:PINNER_WINGET_MANIFEST = 'C:\nonexistent\winget-manifest'
                  $env:PINNER_SCOOP_MANIFEST = '${{ github.workspace }}\tests\fixtures\scoop-manifest\pinner.json'
                  $output = ./install.ps1 *>&1 | Out-String
                  if ($output -match 'CI mode: installing from local manifest.*scoop') {
                    Write-Host "PASS: Scoop manifest path reached"
                    exit 0
                  } else {
                    Write-Host "FAIL: Scoop manifest path not reached"
                    Write-Host $output
                    exit 1
                  }

    test-windows-multi-pm:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - name: CI mode - both manifest fixtures
              shell: pwsh
              run: |
                  $env:CI = 'true'
                  # Pin version so version resolution is local (no network call);
                  # this test only exercises PM dispatch, not the latest-version
                  # endpoint or a real download.
                  $env:PINNER_VERSION = '0.0.0-test'
                  $env:PINNER_WINGET_MANIFEST = '${{ github.workspace }}\tests\fixtures\winget-manifest'
                  $env:PINNER_SCOOP_MANIFEST = '${{ github.workspace }}\tests\fixtures\scoop-manifest\pinner.json'
                  $output = ./install.ps1 *>&1 | Out-String
                  if ($output -match 'CI mode: installing from local manifest') {
                    Write-Host "PASS: PM manifest path reached"
                    # This test validates the PM dispatch path, not a successful
                    # install; normalize the step exit code (install.ps1 may
                    # leave $LASTEXITCODE non-zero from a later binary fallback).
                    exit 0
                  } else {
                    Write-Host "FAIL: Neither winget nor scoop manifest path reached"
                    Write-Host $output
                    exit 1
                  }

    test-windows-routing:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - name: -NoPkg skips PM detection
              shell: pwsh
              run: |
                  $output = ./install.ps1 -NoPkg *>&1 | Out-String
                  if ($output -match 'winget|scoop') {
                    Write-Host "FAIL: PM was attempted despite -NoPkg"
                    exit 1
                  }
                  $env:PATH = "$env:LOCALAPPDATA\Programs\pinner;$env:PATH"
                  pinner --version

            - name: CI=1 env var
              shell: pwsh
              run: |
                  $env:CI = '1'
                  ./install.ps1
                  $env:PATH = "$env:LOCALAPPDATA\Programs\pinner;$env:PATH"
                  pinner --version

    test-sh-routing:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Homebrew not attempted on Linux (Alpine + mock brew)
              uses: vjik/docker-run@v1
              with:
                  image: alpine:latest
                  volumes: ${{ github.workspace }}:/workspace
                  command: |
                      apk add --no-cache curl
                      printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/brew && chmod +x /usr/local/bin/brew
                      output=$(sh /workspace/install.sh --debug 2>&1 || true)
                      if echo "$output" | grep -qi "homebrew"; then
                        echo "FAIL: Homebrew was attempted on Linux"
                        exit 1
                      fi

            - name: --no-pkg skips PM detection (Debian + dpkg present)
              uses: vjik/docker-run@v1
              with:
                  image: debian:12-slim
                  volumes: ${{ github.workspace }}:/workspace
                  command: |
                      apt-get update && apt-get install -y curl
                      output=$(sh /workspace/install.sh --no-pkg --debug 2>&1 || true)
                      if echo "$output" | grep -qi "dpkg\|homebrew\|rpm"; then
                        echo "FAIL: PM was attempted despite --no-pkg"
                        exit 1
                      fi

            - name: PINNER_VERSION env var overrides version fetch (Debian)
              uses: vjik/docker-run@v1
              with:
                  image: debian:12-slim
                  volumes: ${{ github.workspace }}:/workspace
                  env: |
                      PINNER_VERSION=0.0.1
                  command: |
                      apt-get update && apt-get install -y curl
                      output=$(sh /workspace/install.sh --debug 2>&1 || true)
                      if echo "$output" | grep -qi "Could not determine the latest version"; then
                        echo "FAIL: PINNER_VERSION did not override version fetch"
                        exit 1
                      fi

    test-stderr-isolation:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: info()/completed() write to stderr, not stdout
              shell: sh
              run: |
                  set -eu
                  # Verify info() and completed() redirect to stderr.
                  # stdout is captured by $() in download_snapshot_artifact and others —
                  # if info()/completed() leak to stdout, the captured path is corrupt
                  # (see bug: tar receives "[info] ... path" instead of just "path").
                  #
                  # Portion of install.sh functions under test:
                  info() {
                      printf '\033[1;34m[info]\033[0m  %s\n' "$1" >&2
                  }
                  completed() {
                      printf '\033[1;32m[ok]\033[0m    %s\n' "$1" >&2
                  }

                  # Simulate a function that mixes info() calls with a printf return value,
                  # exactly like download_snapshot_artifact / build_snapshot_url do.
                  fake_capture_func() {
                      info "Step one"
                      info "Step two"
                      info "Step three"
                      printf '%s' "/tmp/artifact/pinner-cli_0.0.0-develop_linux_amd64.tar.gz"
                  }

                  # Capture only stdout — info() should be on stderr, not captured
                  _result="$(fake_capture_func)"

                  # The captured value must be the clean path only
                  _expected="/tmp/artifact/pinner-cli_0.0.0-develop_linux_amd64.tar.gz"
                  if [ "$_result" = "$_expected" ]; then
                      echo "PASS: stdout capture is clean (no info leakage)"
                  else
                      echo "FAIL: stdout capture is polluted"
                      echo "  Expected: $_expected"
                      echo "  Got:      $_result"
                      exit 1
                  fi

                  # Also verify that info messages went to stderr (visible to user)
                  _stderr_out="$(fake_capture_func 2>&1 1>/dev/null)"
                  if echo "$_stderr_out" | grep -q "Step one"; then
                      echo "PASS: info messages on stderr"
                  else
                      echo "FAIL: info messages not on stderr"
                      exit 1
                  fi

            - name: info()/completed() don't leak into $() in install.sh itself
              uses: vjik/docker-run@v1
              with:
                  image: debian:12-slim
                  volumes: ${{ github.workspace }}:/workspace
                  command: |
                      apt-get update && apt-get install -y curl
                      # Run with --version develop --no-pkg --debug
                      # This exercises the snapshot path: download_snapshot_artifact captures
                      # a value via $() while info() is called inside.
                      # Before the fix, info("Looking up CI snapshot...") leaked into the
                      # captured _url variable, and tar received the info text as its filename.
                      output=$(sh /workspace/install.sh --version develop --no-pkg --debug 2>&1 || true)
                      # The "Downloaded" line should contain ONLY the archive name, not [info] prefixes
                      # If the bug is present, the wget/curl download itself fails on a corrupt URL
                      # and we won't see a clean "Downloading snapshot artifact" line followed by
                      # "Downloaded <archive_name>".
                      # Instead check that no "Cannot open" tar error occurs from path corruption.
                      if echo "$output" | grep -q "Cannot open"; then
                          echo "FAIL: tar received corrupted path (info leakage in capture)"
                          echo "$output" | grep "Cannot open"
                          exit 1
                      fi
                      echo "PASS: No tar path corruption from stdout capture"

    test-version-targeting:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Semver version targeting uses GitHub Releases path
              uses: vjik/docker-run@v1
              with:
                  image: debian:12-slim
                  volumes: ${{ github.workspace }}:/workspace
                  command: |
                      apt-get update && apt-get install -y curl
                      output=$(sh /workspace/install.sh --version 0.2.0 --no-pkg --debug 2>&1 || true)
                      # Should NOT attempt GitHub Actions API
                      if echo "$output" | grep -qi "Looking up CI snapshot"; then
                        echo "FAIL: Semver version triggered snapshot path"
                        exit 1
                      fi
                      # Should attempt to download from GitHub Releases (will fail: no such release)
                      if ! echo "$output" | grep -qi "Downloading pinner-cli_0.2.0"; then
                        echo "FAIL: Did not attempt download for semver version"
                        exit 1
                      fi

            - name: Git hash version targeting uses Actions API path
              uses: vjik/docker-run@v1
              with:
                  image: debian:12-slim
                  volumes: ${{ github.workspace }}:/workspace
                  command: |
                      apt-get update && apt-get install -y curl
                      output=$(sh /workspace/install.sh --version abc1234 --no-pkg --debug 2>&1 || true)
                      # Should attempt GitHub Actions API lookup
                      if ! echo "$output" | grep -qi "Looking up CI snapshot"; then
                        echo "FAIL: Git hash did not trigger snapshot path"
                        exit 1
                      fi

            - name: Branch name version targeting uses Actions API path
              uses: vjik/docker-run@v1
              with:
                  image: debian:12-slim
                  volumes: ${{ github.workspace }}:/workspace
                  command: |
                      apt-get update && apt-get install -y curl
                      output=$(sh /workspace/install.sh --version develop --no-pkg --debug 2>&1 || true)
                      # Should attempt GitHub Actions API lookup
                      if ! echo "$output" | grep -qi "Looking up CI snapshot"; then
                        echo "FAIL: Branch name did not trigger snapshot path"
                        exit 1
                      fi

            - name: --version flag takes priority over PINNER_VERSION env
              uses: vjik/docker-run@v1
              with:
                  image: debian:12-slim
                  volumes: ${{ github.workspace }}:/workspace
                  env: |
                      PINNER_VERSION=0.0.1
                  command: |
                      apt-get update && apt-get install -y curl
                      output=$(sh /workspace/install.sh --version 0.2.0 --no-pkg --debug 2>&1 || true)
                      if echo "$output" | grep -qi "0.0.1"; then
                        echo "FAIL: Env var took priority over --version flag"
                        exit 1
                      fi

    test-sh-progress:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: "Non-TTY: downloads stay silent (no tool progress frames) and spinner wrapper is a no-op passthrough"
              uses: vjik/docker-run@v1
              with:
                  image: debian:12-slim
                  volumes: ${{ github.workspace }}:/workspace
                  command: |
                      set -eu
                      apt-get update >/dev/null && apt-get install -y curl >/dev/null
                      # Download progress is rendered by our own run_with_spinner, so the
                      # download tools must stay silent: no curl --progress-bar and no
                      # wget --no-verbose (both emit terminal-control frames that render
                      # as scrambled garbage like `##0=-##` mid-transfer). Assert the
                      # shipped script never enables either.
                      if grep -qE '(--progress-bar|--no-verbose)' /workspace/install.sh; then
                        echo "FAIL: install.sh still enables a tool-owned progress bar"
                        grep -nE '(--progress-bar|--no-verbose)' /workspace/install.sh
                        exit 1
                      fi
                      # And curl/wget downloads must be silent.
                      if ! grep -q 'curl --fail --silent --show-error' /workspace/install.sh || \
                         ! grep -q 'wget --quiet' /workspace/install.sh; then
                        echo "FAIL: downloads not fully silent"
                        exit 1
                      fi
                      echo "PASS: downloads stay silent; progress comes from run_with_spinner"

                      # Pull the spinner helper out of the shipped script so we test the
                      # real code, not a drift-prone copy.
                      sed -n '/^run_with_spinner()/,/^}/p' /workspace/install.sh > /tmp/prog.sh
                      . /tmp/prog.sh

                      # run_with_spinner on non-TTY is a pure passthrough: exit status
                      # propagates, and no spinner bytes leak into captured output.
                      if ! run_with_spinner "Extracting" true; then
                        echo "FAIL: true should pass"; exit 1
                      fi
                      if run_with_spinner "Extracting" false 2>/tmp/spin-err; then
                        echo "FAIL: false should fail"; exit 1
                      fi
                      # No spinner control chars (CR, ESC) on a non-TTY stderr.
                      if grep -qE $'\r|\x1b' /tmp/spin-err; then
                        echo "FAIL: spinner control chars leaked on non-TTY stderr"
                        cat -v /tmp/spin-err
                        exit 1
                      fi
                      echo "PASS: run_with_spinner is a clean passthrough on non-TTY"

            - name: "TTY: spinner animates on stderr and command completes"
              uses: vjik/docker-run@v1
              with:
                  image: debian:12-slim
                  volumes: ${{ github.workspace }}:/workspace
                  command: |
                      set -eu
                      apt-get update >/dev/null && apt-get install -y curl util-linux >/dev/null
                      awk '/^run_with_spinner\(\)/{f=1} f{print} f&&/^}/{exit}' /workspace/install.sh > /tmp/tty-spin.sh
                      cat >> /tmp/tty-spin.sh <<'HARNESS'
                      SPINNER_INTERVAL=0.01
                      run_with_spinner "Extracting" sleep 0.3
                      echo "SPIN_COMPLETE"
                      HARNESS
                      # script allocates a pty so [ -t 2 ] is true; capture stderr.
                      script -qec "sh /tmp/tty-spin.sh" /dev/null >/tmp/tty.out 2>&1
                      if ! grep -q SPIN_COMPLETE /tmp/tty.out; then
                        echo "FAIL: pty run did not complete"; cat -v /tmp/tty.out; exit 1
                      fi
                      # Spinner writes rotating chars (| / - \ ) followed by CR line clears.
                      if grep -qE '\|' /tmp/tty.out || grep -qE '/' /tmp/tty.out; then
                        echo "PASS: spinner animated on a TTY stderr"
                      else
                        echo "FAIL: no spinner chars on TTY output:"; cat -v /tmp/tty.out; exit 1
                      fi

    test-sh-scanner:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: PINNER_SELF_TEST reports existing binary install
              uses: vjik/docker-run@v1
              with:
                  image: debian:12-slim
                  volumes: ${{ github.workspace }}:/workspace
                  command: |
                      apt-get update && apt-get install -y curl
                      mkdir -p /root/.local/bin
                      printf '#!/bin/sh\necho "pinner v2.3.4"\n' > /root/.local/bin/pinner
                      chmod +x /root/.local/bin/pinner
                      output=$(PINNER_SELF_TEST=1 HOME=/root sh /workspace/install.sh)
                      if echo "$output" | grep -q "binary|/root/.local/bin|2.3.4|"; then
                        echo "PASS: scanner detected binary install"
                      else
                        echo "FAIL: scanner output: $output"
                        exit 1
                      fi

            - name: "Scanner: rpm present but package absent -> no phantom rpm entry"
              uses: vjik/docker-run@v1
              with:
                  image: debian:12-slim
                  volumes: ${{ github.workspace }}:/workspace
                  command: |
                      apt-get update && apt-get install -y curl
                      # Mock rpm: `-q <pkg>` prints the real "not installed" notice
                      # (exit 1) unless a marker file says the package is installed.
                      # This reproduces a Debian box that has the rpm binary but no
                      # pinner-cli package -- which used to invent a phantom rpm
                      # install because 'package pinner-cli is not installed'
                      # contains the string "pinner-cli".
                      cat > /usr/local/bin/rpm <<'EOF'
                      #!/bin/sh
                      if [ "$1" = "-q" ]; then
                        pkg="$2"
                        if [ -f /var/mock-rpm-installed ]; then
                          echo "${pkg}-1.0.0"
                          exit 0
                        fi
                        echo "package ${pkg} is not installed"
                        exit 1
                      fi
                      exit 0
                      EOF
                      chmod +x /usr/local/bin/rpm
                      export HOME=/root
                      output=$(PINNER_SELF_TEST=1 sh /workspace/install.sh)
                      if echo "$output" | grep -q "^rpm|"; then
                        echo "FAIL: phantom rpm entry emitted when package absent"
                        echo "output: $output"
                        exit 1
                      fi
                      echo "PASS: no phantom rpm entry when package absent"

            - name: "Scanner: rpm present and package installed -> rpm entry emitted"
              uses: vjik/docker-run@v1
              with:
                  image: debian:12-slim
                  volumes: ${{ github.workspace }}:/workspace
                  command: |
                      apt-get update && apt-get install -y curl
                      # Same mock rpm; now the package is genuinely installed so
                      # `rpm -q pinner-cli` returns "pinner-cli-<ver>" (prefix match).
                      # Guards against over-anchoring: a real rpm install must still
                      # be detected.
                      cat > /usr/local/bin/rpm <<'EOF'
                      #!/bin/sh
                      if [ "$1" = "-q" ]; then
                        pkg="$2"
                        if [ -f /var/mock-rpm-installed ]; then
                          echo "${pkg}-1.0.0"
                          exit 0
                        fi
                        echo "package ${pkg} is not installed"
                        exit 1
                      fi
                      exit 0
                      EOF
                      chmod +x /usr/local/bin/rpm
                      touch /var/mock-rpm-installed
                      printf '#!/bin/sh\necho "pinner v1.0.0"\n' > /usr/bin/pinner
                      chmod +x /usr/bin/pinner
                      export HOME=/root
                      output=$(PINNER_SELF_TEST=1 sh /workspace/install.sh)
                      if echo "$output" | grep -q "^rpm|/usr/bin|"; then
                        echo "PASS: scanner detected genuine rpm install"
                      else
                        echo "FAIL: genuine rpm install not detected"
                        echo "output: $output"
                        exit 1
                      fi

    test-sh-reconcile:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: "Deferred reconcile: failed install preserves old, success removes differing install"
              uses: vjik/docker-run@v1
              with:
                  image: debian:12-slim
                  volumes: ${{ github.workspace }}:/workspace
                  command: |
                      set -e
                      apt-get update >/dev/null && apt-get install -y curl unzip python3 >/dev/null
                      TEST_VER="0.0.0-test"
                      TARBALL="pinner-cli_${TEST_VER}_linux_amd64.tar.gz"
                      # install.sh appends /v$VERSION/ to --base-url, so serve the
                      # archive + checksums from a v$TEST_VER/ subdirectory. Built
                      # locally and served over localhost: fully deterministic, no
                      # external network.
                      mkdir -p /srv/"v${TEST_VER}"
                      printf '#!/bin/sh\necho "pinner %s"\n' "$TEST_VER" > /srv/pinner
                      chmod +x /srv/pinner
                      cp /srv/pinner /srv/"v${TEST_VER}"/
                      ( cd /srv/"v${TEST_VER}" && tar -czf "$TARBALL" pinner )
                      ( cd /srv/"v${TEST_VER}" && sha256sum "$TARBALL" | awk '{print $1"  "$2}' > checksums.txt )
                      # Start a local HTTP server serving /srv (where the archive
                      # lives under v$TEST_VER/). Wait until it is reachable.
                      python3 -m http.server 18567 --bind 127.0.0.1 --directory /srv >/var/run/srv.log 2>&1 &
                      SRV=$!
                      trap 'kill $SRV 2>/dev/null || true' EXIT
                      for i in $(seq 1 30); do
                        curl -sf -o /dev/null "http://127.0.0.1:18567/" && break
                        sleep 0.5
                      done
                      echo "server ready (pid $SRV)"
                      # Mock brew present at /opt/brew with an uninstall removing the binary.
                      mkdir -p /opt/brew/bin /root/.local/bin
                      printf '#!/bin/sh\necho "pinner v1.0.0"\n' > /opt/brew/bin/pinner
                      chmod +x /opt/brew/bin/pinner
                      printf '#!/bin/sh\ncase "$1" in\n  --prefix) echo /opt/brew ;;\n  uninstall) rm -f /opt/brew/bin/pinner ;;\nesac\n' > /usr/local/bin/brew
                      chmod +x /usr/local/bin/brew
                      export HOME=/root
                      export PATH="/root/.local/bin:/usr/local/bin:/usr/bin:/bin"

                      # CASE 1 (deferral safety): a FAILED install must NOT remove
                      # the existing differing-method (brew) install.
                      echo "=== case 1: failing install preserves existing brew install ==="
                      sh /workspace/install.sh --no-pkg --version "$TEST_VER" --base-url "http://127.0.0.1:9" >/tmp/c1.log 2>&1 || true
                      if [ -x /opt/brew/bin/pinner ]; then
                        echo "PASS: failed install preserved existing brew install"
                      else
                        echo "FAIL: failed install tore down existing brew install"
                        cat /tmp/c1.log; exit 1
                      fi

                      # CASE 2 (post-install reconcile): a SUCCESSFUL install removes
                      # the differing-method (brew) install and leaves the new binary.
                      # ALLOW_HTTP=1 opts into the local plaintext mirror (TLS is
                      # enforced by default; the test explicitly permits http).
                      echo "=== case 2: successful install reconciles away differing brew install ==="
                      if ! ALLOW_HTTP=1 sh /workspace/install.sh --no-pkg --version "$TEST_VER" --base-url "http://127.0.0.1:18567" >/tmp/c2.log 2>&1; then
                        echo "install.sh failed in case 2; log:"
                        cat /tmp/c2.log
                        echo "--- server log (/var/run/srv.log) ---"
                        cat /var/run/srv.log 2>/dev/null || true
                        exit 1
                      fi
                      cat /tmp/c2.log
                      if [ -x /opt/brew/bin/pinner ]; then
                        echo "FAIL: differing brew install not removed after successful install"
                        exit 1
                      fi
                      echo "PASS: differing brew install removed after successful install"
                      if [ -x /root/.local/bin/pinner ]; then
                        echo "PASS: new pinner installed at target"
                      else
                        echo "FAIL: target binary missing"
                        exit 1
                      fi

    test-sh-reconcile-system:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: "Reconcile cleans a stale system binary when privileged; stays non-fatal when not"
              uses: vjik/docker-run@v1
              with:
                  image: debian:12-slim
                  volumes: ${{ github.workspace }}:/workspace
                  command: |
                      set -e
                      apt-get update >/dev/null && apt-get install -y curl unzip python3 sudo passwd >/dev/null
                      TEST_VER="0.0.0-recon"
                      TARBALL="pinner-cli_${TEST_VER}_linux_amd64.tar.gz"
                      # Serve a local mirror so the install itself is deterministic
                      # (same pattern as test-sh-reconcile).
                      mkdir -p /srv/"v${TEST_VER}"
                      printf '#!/bin/sh\necho "pinner %s"\n' "$TEST_VER" > /srv/pinner
                      chmod +x /srv/pinner
                      cp /srv/pinner /srv/"v${TEST_VER}"/
                      ( cd /srv/"v${TEST_VER}" && tar -czf "$TARBALL" pinner )
                      ( cd /srv/"v${TEST_VER}" && sha256sum "$TARBALL" | awk '{print $1"  "$2}' > checksums.txt )
                      python3 -m http.server 18568 --bind 127.0.0.1 --directory /srv >/var/run/srv2.log 2>&1 &
                      SRV=$!
                      trap 'kill $SRV 2>/dev/null || true' EXIT
                      for i in $(seq 1 30); do
                        curl -sf -o /dev/null "http://127.0.0.1:18568/" && break
                        sleep 0.5
                      done

                      # A stale rpm record: the scanner's `rpm -q pinner-cli` reports
                      # the package (so reconcile targets /usr/bin), but `rpm -e`
                      # fails -- the package is not actually removable, exactly the
                      # dpkg-host-stale-rpm case from the field. A physical
                      # /usr/bin/pinner binary is left behind to shadow PATH.
                      printf '#!/bin/sh\nif [ "$1" = "-q" ]; then\n  echo "pinner-cli-0.1.0"\n  exit 0\nelif [ "$1" = "-e" ]; then\n  echo "error: package pinner-cli is not installed" >/dev/stderr\n  exit 1\nfi\nexit 0\n' > /usr/local/bin/rpm
                      chmod +x /usr/local/bin/rpm
                      printf '#!/bin/sh\necho "pinner v0.1.0"\n' > /usr/bin/pinner
                      chmod +x /usr/bin/pinner

                      # CASE 1 (privileged, the F2 fix): running as root, reconcile
                      # fails the `rpm -e` but must remove the stale /usr/bin/pinner
                      # directly instead of declaring "no privileges" and leaving it.
                      echo "=== case 1: root reconcile removes stale system binary ==="
                      export HOME=/root
                      export PATH="/root/.local/bin:/usr/local/bin:/usr/bin:/bin"
                      if ! ALLOW_HTTP=1 sh /workspace/install.sh --no-pkg --version "$TEST_VER" --base-url "http://127.0.0.1:18568" >/tmp/s1.log 2>&1; then
                        echo "install.sh failed in case 1; log:"; cat /tmp/s1.log; exit 1
                      fi
                      cat /tmp/s1.log
                      if [ -x /usr/bin/pinner ]; then
                        echo "FAIL: stale /usr/bin/pinner not removed by root reconcile"
                        exit 1
                      fi
                      echo "PASS: stale /usr/bin/pinner removed by root reconcile"
                      if grep -q "Reconciliation could not remove" /tmp/s1.log; then
                        echo "FAIL: root reconcile still reported an unremovable leftover"
                        exit 1
                      fi
                      echo "PASS: no leftover error under root"

                      # CASE 2 (unprivileged): a non-root user without passwordless
                      # sudo cannot remove a root-owned /usr/bin/pinner. The install
                      # to their own ~/.local/bin must still succeed and reconcile
                      # must stay non-fatal (warn + leftover, not abort).
                      echo "=== case 2: non-root reconcile stays non-fatal ==="
                      # /usr/sbin/useradd lives off the trimmed PATH above.
                      /usr/sbin/useradd -m -s /bin/sh tester
                      # Give tester a writable default install dir so the binary
                      # install needs no sudo (which would mask the reconcile case
                      # we are probing).
                      mkdir -p /home/tester/.local/bin
                      chown tester:tester /home/tester/.local/bin
                      # CASE 1 removed the stale /usr/bin/pinner as root; recreate
                      # it so the unprivileged reconcile has a leftover to face.
                      # The fake rpm record still reports the package, so the scan
                      # targets /usr/bin again.
                      printf '#!/bin/sh\necho "pinner v0.1.0"\n' > /usr/bin/pinner
                      chmod +x /usr/bin/pinner
                      chmod 777 /usr/local/bin/rpm
                      su tester -s /bin/sh -c \
                        'HOME=/home/tester ALLOW_HTTP=1 sh /workspace/install.sh --no-pkg --version '"$TEST_VER"' --base-url http://127.0.0.1:18568 >/tmp/s2.log 2>&1' || {
                          echo "non-root install failed; log:"; cat /tmp/s2.log; exit 1; }
                      cat /tmp/s2.log
                      if ! grep -q "Installed pinner to /home/tester/.local/bin/pinner" /tmp/s2.log; then
                        echo "FAIL: non-root install did not land in tester's ~/.local/bin"
                        exit 1
                      fi
                      if grep -q "Reconciliation could not remove" /tmp/s2.log; then
                        echo "PASS: non-root reconcile reported unswept leftover (expected, non-fatal)"
                      else
                        echo "FAIL: expected a leftover warning for non-root user"
                        exit 1
                      fi
                      echo "PASS: non-root reconcile was non-fatal; install completed"

    test-windows-progress:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - name: Expand-ArchiveWithProgress drives a determinate 0->100 bar and extracts
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  # Pull the real helper out of the shipped script so we test the actual
                  # code, not a copy that could drift.
                  $src = Get-Content -Raw ./install.ps1
                  $m = [regex]::Match($src, 'function Expand-ArchiveWithProgress \{.*?\n\}', [System.Text.RegularExpressions.RegexOptions]::Singleline)
                  if (-not $m.Success) { Write-Host 'FAIL: could not extract helper'; exit 1 }
                  Invoke-Expression $m.Value

                  $srcDir = Join-Path $env:TEMP 'zip-src'
                  New-Item -ItemType Directory -Path $srcDir -Force | Out-Null
                  1..3 | ForEach-Object { Set-Content -Path (Join-Path $srcDir "file$_.txt") -Value "content$_" }
                  $zipPath = Join-Path $env:TEMP 'prog.zip'
                  Compress-Archive -Path (Join-Path $srcDir '*') -DestinationPath $zipPath -Force
                  $dest = Join-Path $env:TEMP 'zip-out'
                  New-Item -ItemType Directory -Path $dest -Force | Out-Null

                  # Recording sink: captures every percent step the helper reports.
                  $recorded = New-Object System.Collections.Generic.List[object]
                  $sink = {
                      param($id, $activity, $current, $total)
                      $script:recorded.Add([pscustomobject]@{ current = $current; total = $total; pct = [math]::Round(100 * $current / $total) })
                  }
                  Expand-ArchiveWithProgress -Path $zipPath -DestinationPath $dest -ProgressSink $sink

                  if ((Get-ChildItem $dest -File).Count -ne 3) { Write-Host 'FAIL: expected 3 files'; exit 1 }
                  if ($recorded.Count -lt 2) { Write-Host 'FAIL: progress did not advance'; exit 1 }
                  $last = $recorded[-1]
                  if ($last.current -ne $last.total -or $last.pct -ne 100) { Write-Host "FAIL: progress not at 100 (got $($last.pct))"; exit 1 }
                  for ($i = 1; $i -lt $recorded.Count; $i++) {
                      if ($recorded[$i].current -le $recorded[$i-1].current) { Write-Host 'FAIL: progress not monotonic'; exit 1 }
                  }
                  Write-Host "PASS: extracted 3 files, progress advanced $($recorded.Count) steps to 100%"

                  # Zip-Slip protection: a crafted archive with a path-traversal
                  # entry (`..\escape.txt`) must be rejected and must not write
                  # outside the destination root.
                  Add-Type -AssemblyName System.IO.Compression -ErrorAction SilentlyContinue
                  $evilZip = Join-Path $env:TEMP 'evil.zip'
                  $evilDir = Join-Path $env:TEMP 'evil-root'
                  New-Item -ItemType Directory -Path $evilDir -Force | Out-Null
                  New-Item -ItemType Directory -Path (Split-Path $evilZip) -Force -ErrorAction SilentlyContinue | Out-Null
                  $fs = [System.IO.File]::Open($evilZip, [System.IO.FileMode]::Create)
                  $arc = New-Object System.IO.Compression.ZipArchive($fs, [System.IO.Compression.ZipArchiveMode]::Create)
                  $e = $arc.CreateEntry('..\escape.txt')
                  $s = $e.Open(); $s.WriteByte(1); $s.Dispose()
                  $arc.Dispose(); $fs.Dispose()
                  # Landing area: marker tells us if traversal succeeded.
                  $outsideRoot = Split-Path $dest -Parent   # one level above dest
                  $marker = Join-Path $outsideRoot 'escape.txt'
                  Remove-Item $marker -ErrorAction SilentlyContinue
                  $evasion = $false
                  try {
                      Expand-ArchiveWithProgress -Path $evilZip -DestinationPath $dest -ProgressSink $sink
                      $evasion = $true   # no exception => traversal not blocked
                  } catch {
                      Write-Host "PASS: traversal entry rejected ($($_.Exception.Message))"
                  }
                  if ($evasion) { Write-Host 'FAIL: traversal entry was not rejected'; exit 1 }
                  if (Test-Path $marker) { Write-Host 'FAIL: escape.txt was written outside dest'; exit 1 }
                  Write-Host 'PASS: no file written outside the destination root'

    test-win-reconcile:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - name: PINNER_SELF_TEST detects Windows binary install
              shell: pwsh
              run: |
                  $dir = Join-Path $env:LOCALAPPDATA 'Programs\pinner'
                  New-Item -Path $dir -ItemType Directory -Force | Out-Null
                  $bin = Join-Path $dir 'pinner.exe'
                  Set-Content -Path $bin -Value 'placeholder' -NoNewline
                  $env:PINNER_SELF_TEST = '1'
                  $output = ./install.ps1 *>&1 | Out-String
                  if ($output -match [regex]::Escape("binary|$dir")) {
                    Write-Host "PASS: scanner detected binary install"
                  } else {
                    Write-Host "FAIL: scanner output: $output"
                    exit 1
                  }

